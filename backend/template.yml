AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Parameters:
  DbHost:
    Type: String
  DbName:
    Type: String
  DbPassword:
    Type: String
  DbUser:
    Type: String
  Port:
    Type: String
  JwtAccessSecret:
    Type: String
  JwtAccessExpires:
    Type: String
  CorsOrigins:
    Type: String
    Default: https://manyata.in,https://www.manyata.in,http://localhost:5173

Resources:
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/server.handler
      Runtime: nodejs24.x
      MemorySize: 2048
      Timeout: 30
      Environment:
        Variables:
          DB_HOST:
            Ref: DbHost
          DB_PORT: '3306'
          DB_NAME:
            Ref: DbName
          DB_PASSWORD:
            Ref: DbPassword
          DB_USER:
            Ref: DbUser
          PORT:
            Ref: Port
          JWT_ACCESS_SECRET:
            Ref: JwtAccessSecret
          JWT_ACCESS_EXPIRES:
            Ref: JwtAccessExpires
          CORS_ORIGINS:
            Ref: CorsOrigins
      Events:
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /{proxy+}
            Method: ANY

Outputs:
  AppFunctionArn:
    Description: Lambda Function ARN
    Value:
      Fn::GetAtt:
        - AppFunction
        - Arn
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/api/
